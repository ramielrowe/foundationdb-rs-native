[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ramielrowe/foundationdb-rs-native"
rust-version = "1.85"

[workspace.dependencies]
fdb-native-wire = { version = "0.0.0", path = "crates/fdb-native-wire" }
fdb-native-wire-derive = { version = "0.0.0", path = "crates/fdb-native-wire-derive" }
fdb-native-schema = { version = "0.0.0", path = "crates/fdb-native-schema" }
# Without its default `tokio` feature: the client is runtime-agnostic. A member that needs
# `TokioRuntime` must enable it itself (`features = ["tokio"]`, for tests a dev-dependency).
fdb-native-transport = { version = "0.0.0", path = "crates/fdb-native-transport", default-features = false }

# Persistent ordered map (MIT) for the client's write map: O(log n) structural sharing, so a
# snapshot iterator makes the next write cost a path copy, not a copy of the whole map. MSRV 1.85.
rpds = "1.2.1"
# Shared byte buffers (MIT, no dependencies, MSRV 1.57): the rows of a range read are slices of
# the reply they came in (`KeyValue`), so a row costs a reference count, not two allocations.
bytes = "1.12.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
