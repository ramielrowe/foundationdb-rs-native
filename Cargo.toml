[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ramielrowe/foundationdb-rs-native"
rust-version = "1.85"

[workspace.dependencies]
fdb-native-wire = { version = "0.0.0", path = "crates/fdb-native-wire" }
fdb-native-wire-derive = { version = "0.0.0", path = "crates/fdb-native-wire-derive" }
fdb-native-schema = { version = "0.0.0", path = "crates/fdb-native-schema" }
fdb-native-transport = { version = "0.0.0", path = "crates/fdb-native-transport", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
