name: Bindingtester

# Manual trigger only: runs the upstream bindingtester (Python binding + libfdb_c in Docker)
# against crates/fdb-native-stacktester. See tools/bindingtester/README.md.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Comma list of api, scripted, tuple
        default: api,scripted,tuple
      seeds:
        description: Seeds per suite
        default: "3"
      num_ops:
        description: Operations per api test
        default: "200"

env:
  CARGO_TERM_COLOR: always

jobs:
  bindingtester:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["7.4", "8.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bindingtester
        env:
          VERSION: ${{ matrix.version }}
          SUITES: ${{ inputs.suites }}
          SEEDS: ${{ inputs.seeds }}
          NUM_OPS: ${{ inputs.num_ops }}
        run: |
          tools/bindingtester/run.sh --version "$VERSION" --suites "$SUITES" --seeds "$SEEDS" \
            --num-ops "$NUM_OPS" --results-dir "$RUNNER_TEMP/bindingtester-results" --keep-logs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bindingtester-${{ matrix.version }}
          path: ${{ runner.temp }}/bindingtester-results
          if-no-files-found: ignore
