name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features fdb-native-transport/tls -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --features fdb-native-transport/tls
        env:
          RUSTDOCFLAGS: -D warnings

  # The workspace's rust-version; dev-dependencies (trybuild) must resolve to versions
  # that build on it too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features fdb-native-transport/tls
      - run: cargo check -p fdb-native-wire --no-default-features --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci
      # nextest does not run doc tests.
      - run: cargo test --doc --workspace
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-unit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The `tls` feature (rustls, the verify_peers rules and verifier, the TLS loopback tests) is
  # off by default, so the jobs above do not build it.
  test-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --features fdb-native-transport/tls
      - run: cargo test --doc --workspace --features fdb-native-transport/tls

  docker-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fdb_image:
          - foundationdb/foundationdb:7.4.10
          - foundationdb/foundationdb:8.0.1
    env:
      FDB_IMAGE: ${{ matrix.fdb_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # cpp_crosscheck (the binary, and the cpp_crosscheck_* tests in other binaries) is ignored because it
      # needs the dev-only golden-vectors tool, not Docker.
      # The tls feature is on so that the TLS docker tests (peer_tls_docker, tls_peer_wrapper) run too;
      # the plain tests are unaffected by it.
      - run: cargo nextest run --workspace --features fdb-native-transport/tls --profile ci --run-ignored only --no-tests=pass -E 'not (binary(cpp_crosscheck) | test(cpp_crosscheck))'
