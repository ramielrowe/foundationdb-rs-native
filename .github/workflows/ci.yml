name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features fdb-native-transport/tls,fdb-native-client/tls -- -D warnings
      # The examples (clippy's --all-targets checks them; this builds them, TLS one included).
      - run: cargo build --workspace --examples --features fdb-native-client/tls
      - run: cargo clippy --workspace --all-targets --features fdb-native-transport/smol,fdb-native-client/smol -- -D warnings
      # Without tokio (the examples need it, but the library and the smol example do not).
      - run: cargo build -p fdb-native-client --no-default-features --features smol --example smol
      - run: cargo clippy -p fdb-native-transport -p fdb-native-client --no-default-features --features fdb-native-transport/smol,fdb-native-client/smol -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --features fdb-native-transport/tls,fdb-native-client/tls
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --features fdb-native-transport/smol,fdb-native-client/smol
        env:
          RUSTDOCFLAGS: -D warnings

  # The workspace's rust-version; dev-dependencies (trybuild) must resolve to versions
  # that build on it too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features fdb-native-transport/tls,fdb-native-client/tls
      - run: cargo check --workspace --all-targets --features fdb-native-transport/smol,fdb-native-client/smol
      - run: cargo check -p fdb-native-wire --no-default-features --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci
      # nextest does not run doc tests.
      - run: cargo test --doc --workspace
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-unit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The `tls` feature (rustls, the verify_peers rules and verifier, the TLS loopback tests) is
  # off by default, so the jobs above do not build it.
  test-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --features fdb-native-transport/tls,fdb-native-client/tls
      - run: cargo test --doc --workspace --features fdb-native-transport/tls,fdb-native-client/tls

  # The smol runtime adapter (`SmolRuntime`, the `smol` features) is off by default. This runs the
  # adapter's tests and the transport and client on smol: the peer manager against a loopback fake
  # server, the client against a fake cluster, TLS over the smol stream. Its docker tests run in
  # `docker-integration` below.
  test-smol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --features fdb-native-transport/smol,fdb-native-client/smol --profile ci
      # With TLS too (the TLS-over-smol loopback tests need both features).
      - run: cargo nextest run -p fdb-native-transport --features smol,tls --profile ci -E 'binary(smol_tls)'
      - run: cargo test --doc --workspace --features fdb-native-transport/smol,fdb-native-client/smol

  docker-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fdb_image:
          - foundationdb/foundationdb:7.4.10
          - foundationdb/foundationdb:8.0.1
    env:
      FDB_IMAGE: ${{ matrix.fdb_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # cpp_crosscheck (the binary, and the cpp_crosscheck_* tests in other binaries) is ignored because it
      # needs the dev-only golden-vectors tool, not Docker.
      # The tls features are on so that the TLS docker tests (peer_tls_docker, tls_peer_wrapper, and the
      # client's docker_database and docker_examples TLS tests) run too, and the smol features so that
      # the docker tests on the smol adapter (smol_docker, docker_smol) do;
      # the plain tests are unaffected by them.
      - run: cargo nextest run --workspace --features fdb-native-transport/tls,fdb-native-client/tls,fdb-native-transport/smol,fdb-native-client/smol --profile ci --run-ignored only --no-tests=pass -E 'not (binary(cpp_crosscheck) | test(cpp_crosscheck))'
