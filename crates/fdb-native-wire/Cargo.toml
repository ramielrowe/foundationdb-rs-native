[package]
name = "fdb-native-wire"
description = "Sans-IO codec for FoundationDB's flatbuffers dialect and legacy binary format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["derive"]
# `#[derive(Wire)]`, re-exported as `fdb_native_wire::Wire`.
derive = ["dep:fdb-native-wire-derive"]

[dependencies]
fdb-native-wire-derive = { workspace = true, optional = true }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
