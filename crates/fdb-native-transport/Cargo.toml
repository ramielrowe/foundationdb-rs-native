[package]
name = "fdb-native-transport"
description = "Runtime-agnostic FoundationDB connection layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["tokio"]
# Adapter for the tokio runtime (`runtime::TokioRuntime`).
tokio = ["dep:tokio"]
# TLS support. The `tls_verify` module is FDB's `verify_peers` rule language and its rustls
# certificate verifier.
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:rustls-webpki", "dep:x509-parser"]

[dependencies]
fdb-native-wire.workspace = true
futures-io = "0.3.34"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
tokio = { version = "1.54.1", optional = true, default-features = false, features = ["net", "time", "rt"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"], optional = true }
rustls-pki-types = { version = "1.14.1", optional = true }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"], optional = true }
x509-parser = { version = "0.18.1", optional = true }

[dev-dependencies]
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
futures-lite = "2.6.1"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
proptest = "1.11.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
