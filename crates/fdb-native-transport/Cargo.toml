[package]
name = "fdb-native-transport"
description = "Runtime-agnostic FoundationDB connection layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["tokio"]
# Adapter for the tokio runtime (`runtime::TokioRuntime`).
tokio = ["dep:tokio"]
# TLS client layer (`tls` module): rustls with the `ring` crypto provider, and FDB's
# `verify_peers` rules (`tls::verify_peers`).
tls = [
    "dep:rustls",
    "dep:futures-rustls",
    "dep:rustls-pki-types",
    "dep:rustls-webpki",
    "dep:x509-parser",
    "dep:pkcs8",
    "dep:zeroize",
]
# Use `aws-lc-rs` instead of `ring` as the rustls crypto provider. Additive:
# `ring` stays compiled in, but `aws-lc-rs` is the one the connector uses.
tls-aws-lc-rs = ["tls", "rustls/aws_lc_rs"]

[dependencies]
fdb-native-wire.workspace = true
futures-channel = { version = "0.3.34", default-features = false, features = ["std"] }
futures-core = "0.3.34"
futures-io = "0.3.34"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
tokio = { version = "1.54.1", optional = true, default-features = false, features = ["net", "time", "rt"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"], optional = true }
futures-rustls = { version = "0.26.0", default-features = false, features = ["tls12"], optional = true }
rustls-pki-types = { version = "1.16.0", optional = true }
pkcs8 = { version = "0.10.2", default-features = false, features = ["alloc", "pem", "encryption", "3des", "sha1-insecure"], optional = true }
zeroize = { version = "1.9", optional = true }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"], optional = true }
x509-parser = { version = "0.18.1", optional = true }

[dev-dependencies]
fdb-native-testkit = { path = "../fdb-native-testkit" }
futures-lite = "2.6.1"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "test-util", "net", "io-util", "sync", "time"] }
proptest = "1.11.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
