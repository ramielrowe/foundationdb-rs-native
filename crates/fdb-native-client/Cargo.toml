[package]
name = "fdb-native-client"
description = "Pure-Rust native FoundationDB client API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["tokio"]
# `Database::open` and friends on tokio (`TokioRuntime`), and `TokioRuntime` as the default
# runtime type parameter. Without it the client works over any `Runtime` (`Database::open_with`).
tokio = ["fdb-native-transport/tokio"]
# TLS: clusters whose coordinators are `:tls` (and `DatabaseOptions::tls`), through the
# transport's rustls layer.
tls = ["fdb-native-transport/tls"]

[dependencies]
fdb-native-schema.workspace = true
fdb-native-transport.workspace = true
fdb-native-wire.workspace = true
futures-channel = { version = "0.3.34", default-features = false, features = ["std"] }
futures-core = "0.3.34"
futures-io = "0.3.34"
thiserror = "2.0.21"

[dev-dependencies]
fdb-native-testkit = { path = "../fdb-native-testkit" }
fdb-native-tuple = { path = "../fdb-native-tuple" }
fdb-native-transport = { workspace = true, features = ["tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "test-util", "net", "io-util", "sync", "time"] }
proptest = "1.11.0"
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
tempfile = "3.27.0"
